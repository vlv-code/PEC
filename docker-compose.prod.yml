# Production deployment with Nginx Reverse Proxy & SSL termination
services:
  pec-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: pec-proxy-extension-corp:latest
    container_name: pec-proxy-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - EXT_SHARED_TOKEN=${EXT_SHARED_TOKEN:-corp-proxy-secret-token-change-me}
      - CREDS_STORE=/app/data/current_creds.json
    volumes:
      - pec_data:/app/data
      - pec_extension:/app/extension
      - pec_updates:/app/dist/updates
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: pec-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - pec_updates:/var/www/updates:ro
    depends_on:
      - pec-server

volumes:
  pec_data:
  pec_extension:
  pec_updates:
