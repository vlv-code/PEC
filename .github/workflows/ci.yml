name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Run test suite
        env:
          SKIP_NATIVE_REBUILD: "true"
        run: npm test

      - name: Test coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npm run test:coverage

      - name: Production bundle build
        run: npm run build

      - name: Verify Binary PII Hygiene (No developer paths in binaries)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "templates/app/windows";
            if (!fs.existsSync(dir)) process.exit(0);
            const files = fs.readdirSync(dir).filter(f => f.endsWith(".exe") || f.endsWith(".dll"));
            for (const file of files) {
              const buf = fs.readFileSync(path.join(dir, file));
              const u8 = buf.toString("utf8");
              const u16 = buf.toString("utf16le");
              if (/C:\\Users\\[A-Za-z0-9_.-]+/i.test(u8) || /C:\\Users\\[A-Za-z0-9_.-]+/i.test(u16)) {
                console.error("PII leak detected in: " + file);
                process.exit(1);
              }
            }
            console.log("Binary PII hygiene check passed: 0 leaks found");
          '
