name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Run test suite
        env:
          SKIP_NATIVE_REBUILD: "true"
        run: npm test

      - name: Test coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npm run test:coverage

      - name: Production bundle build
        run: npm run build

      - name: Verify Binary PII Hygiene (No developer paths in binaries)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "templates/app/windows";
            if (!fs.existsSync(dir)) process.exit(0);
            const files = fs.readdirSync(dir).filter(f => f.endsWith(".exe") || f.endsWith(".dll"));
            for (const file of files) {
              const buf = fs.readFileSync(path.join(dir, file));
              const u8 = buf.toString("utf8");
              const u16 = buf.toString("utf16le");
              if (/C:\\Users\\[A-Za-z0-9_.-]+/i.test(u8) || /C:\\Users\\[A-Za-z0-9_.-]+/i.test(u16)) {
                console.error("PII leak detected in: " + file);
                process.exit(1);
              }
            }
            console.log("Binary PII hygiene check passed: 0 leaks found");
          '

  compile-native-client:
    name: Compile Native Windows Client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Download WinDivert SDK
        shell: powershell
        run: |
          $winDivertDir = "C:\WinDivert-2.2.2-A"
          if (-not (Test-Path "$winDivertDir\include\windivert.h")) {
            $zipPath = "$env:TEMP\WinDivert-2.2.2-A.zip"
            $urls = @(
              "https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip",
              "https://reqrypt.org/download/WinDivert-2.2.2-A.zip"
            )
            $downloaded = $false
            foreach ($url in $urls) {
              try {
                Write-Host "Downloading WinDivert SDK from $url..."
                Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing -TimeoutSec 60
                if (Test-Path $zipPath) {
                  $downloaded = $true
                  break
                }
              } catch {
                Write-Warning "Download from $url failed: $_"
              }
            }
            if (-not $downloaded) {
              throw "Failed to download WinDivert SDK from all sources"
            }
            try {
              tar.exe -xf $zipPath --exclude "*.sys" -C "C:\"
            } catch {
              Expand-Archive -Path $zipPath -DestinationPath "C:\" -Force
            }
            Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path "$winDivertDir\include\windivert.h") -or -not (Test-Path "$winDivertDir\x64\WinDivert.lib")) {
            Write-Host "Fallback: fetching raw windivert.h and generating import library from repo WinDivert.dll..."
            New-Item -ItemType Directory -Path "$winDivertDir\include" -Force | Out-Null
            New-Item -ItemType Directory -Path "$winDivertDir\x64" -Force | Out-Null
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/basil00/WinDivert/v2.2.2/include/windivert.h" -OutFile "$winDivertDir\include\windivert.h" -UseBasicParsing
            if (Test-Path "templates\app\windows\WinDivert.dll") {
              $defPath = "$env:TEMP\windivert.def"
              @(
                "LIBRARY WinDivert.dll",
                "EXPORTS",
                "WinDivertClose",
                "WinDivertGetParam",
                "WinDivertHelperCalcChecksums",
                "WinDivertHelperCompileFilter",
                "WinDivertHelperDecrementTTL",
                "WinDivertHelperEvalFilter",
                "WinDivertHelperFormatFilter",
                "WinDivertHelperFormatIPv4Address",
                "WinDivertHelperFormatIPv6Address",
                "WinDivertHelperHashPacket",
                "WinDivertHelperHtonIPv6Address",
                "WinDivertHelperHtonIpv6Address",
                "WinDivertHelperHtonl",
                "WinDivertHelperHtonll",
                "WinDivertHelperHtons",
                "WinDivertHelperNtohIPv6Address",
                "WinDivertHelperNtohIpv6Address",
                "WinDivertHelperNtohl",
                "WinDivertHelperNtohll",
                "WinDivertHelperNtohs",
                "WinDivertHelperParseIPv4Address",
                "WinDivertHelperParseIPv6Address",
                "WinDivertHelperParsePacket",
                "WinDivertOpen",
                "WinDivertRecv",
                "WinDivertRecvEx",
                "WinDivertSend",
                "WinDivertSendEx",
                "WinDivertSetParam",
                "WinDivertShutdown"
              ) | Set-Content -Path $defPath
              lib.exe /nologo /def:$defPath /out:"$winDivertDir\x64\WinDivert.lib" /machine:x64
            }
          }
          if (-not (Test-Path "$winDivertDir\include\windivert.h")) {
            throw "Failed to locate WinDivert SDK at $winDivertDir"
          }
          Write-Host "WinDivert SDK ready at $winDivertDir"

      - name: Compile Native Client Binaries (nmake)
        shell: cmd
        working-directory: client/Windows
        run: |
          nmake -f Makefile.msvc

      - name: Verify Native Binaries
        shell: powershell
        working-directory: client/Windows
        run: |
          $binaries = @(
            "ProxyBridgeCore.dll",
            "PECAppCore.dll",
            "PEC-App.exe",
            "PEC-CLI.exe",
            "PECAppSvc.exe",
            "PEC-App-Setup.exe"
          )
          foreach ($b in $binaries) {
            if (-not (Test-Path $b)) {
              Write-Error "Missing expected binary: $b"
              exit 1
            }
            $len = (Get-Item $b).Length
            Write-Host "Verified $b ($([math]::Round($len/1KB, 1)) KB)"
          }

