# PEC - Proxy Extension Corp
# Nginx Reverse Proxy Configuration with Security & Caching

# Rate limiting zone for sensitive API endpoints
limit_req_zone $binary_remote_addr zone=pec_api_limit:10m rate=30r/m;

upstream pec_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name proxy.corp.internal mini-server.ic.local;

    # Redirect all HTTP traffic to HTTPS (uncomment in production with SSL)
    # return 301 https://$host$request_uri;

    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. PAC file endpoint - Dynamic proxy auto-configuration
    location /proxy.pac {
        proxy_pass http://pec_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        types {
            application/x-ns-proxy-autoconfig pac;
        }
        default_type application/x-ns-proxy-autoconfig;

        # Short cache for fast rule propagation
        expires 60s;
        add_header Cache-Control "public, max-age=60, must-revalidate";
    }

    # 2. Chrome Extension Distribution & Auto-Update XML
    location /updates/ {
        proxy_pass http://pec_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        types {
            application/x-chrome-extension crx;
            application/zip zip;
            application/xml xml;
        }

        # Prevent aggressive proxy caching of updates
        expires 300s;
        add_header Cache-Control "public, max-age=300";
    }

    # 3. Credentials and Sync Endpoints (Rate Limited)
    location ~ ^/(creds|api/sync) {
        limit_req zone=pec_api_limit burst=10 nodelay;

        proxy_pass http://pec_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable caching for sensitive credential exchange
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # 4. Web Management Dashboard & Admin API
    location / {
        proxy_pass http://pec_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
